name: Pages

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - run: |
          TAG=$(gh release view --json tagName -q .tagName)
          mkdir _site
          sed "s#andy-fx@[^/]*/#andy-fx@${TAG#v}/#g" index.html > _site/index.html
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
