name: Release

on: workflow_dispatch

env:
  VERSION: 1.0.${{ github.run_number }} # bump 1.0 by hand for minor/major releases

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # jsDelivr caches the @1 alias for up to 12h; purge so it points at this release now
      - run: curl -sS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@${VERSION%%.*}/andy-fx.min.js"
        continue-on-error: true

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      # Pin the demo page to the version just released
      - run: |
          mkdir _site
          cp og.png _site/
          sed "s#andy-fx@[^/]*/#andy-fx@${VERSION}/#g" index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
