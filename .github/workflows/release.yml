name: Release

on: workflow_dispatch

env:
  VERSION: 1.0.${{ github.run_number }} # bump 1.0 by hand for minor/major releases

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # jsDelivr caches the @1 alias for up to 12h; purge so it points at this release now
      - run: curl -sS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@${VERSION%%.*}/andy-fx.min.js"
        continue-on-error: true

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      # Pin the page to this release and swap Tailwind's in-browser compiler for prebuilt CSS
      - run: |
          mkdir _site
          cp og.png _site/
          sed -e "s#andy-fx@[^/]*/#andy-fx@${VERSION}/#g" \
              -e 's#<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>#<link rel="stylesheet" href="tailwind.css">#' \
              index.html > _site/index.html
          grep -q 'href="tailwind.css"' _site/index.html
          npm install --no-save tailwindcss@4 @tailwindcss/cli@4
          npx @tailwindcss/cli -o _site/tailwind.css --minify

      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
