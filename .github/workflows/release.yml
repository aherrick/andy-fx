name: Release

on: workflow_dispatch

env:
  VERSION: 1.0.${{ github.run_number }} # bump 1.0 by hand for minor/major releases

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
